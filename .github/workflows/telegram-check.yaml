name: telegram-check

# Posts the notes for one tag without rebuilding the artifacts, so channel
# access can be checked after a permission change instead of with a new tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to announce, defaults to the newest one
        required: false

env:
  DART_VERSION: '3.13.5'

jobs:
  post:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}

      - name: Render telegram notes
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          tag="${TAG_INPUT:-$(git describe --tags --abbrev=0)}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          mkdir -p dist
          # The changelog tool needs only package:args, so it runs from a
          # scratch package and never triggers the app's native build hooks.
          mkdir -p /tmp/cl
          cp -r tool /tmp/cl/tool
          cd /tmp/cl
          printf 'name: cl\nenvironment:\n  sdk: ">=3.0.0 <4.0.0"\ndependencies:\n  args: any\n' > pubspec.yaml
          dart pub get
          dart run tool/changelog.dart render telegram --tag "$tag" \
            --root "$GITHUB_WORKSPACE" --out telegram.md
          cat "$GITHUB_WORKSPACE/telegram.md"

      # Fetching the real installers is what makes this a test of the posting
      # path: file sizes decide between a media group and a text post.
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" --dir dist --clobber \
              --pattern '*windows-amd64-setup*' \
              --pattern '*android-arm64*' \
              --pattern '*macos-arm64*' \
              --pattern '*macos-amd64*'
            ls -l dist
          else
            echo "No release for $TAG; the post carries the notes alone"
          fi

      - name: Post to telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 -m pip install --user --break-system-packages --quiet requests
          docker run --detach --name telegram-bot-api \
            --publish 127.0.0.1:8081:8081 \
            --env TELEGRAM_API_ID --env TELEGRAM_API_HASH \
            aiogram/telegram-bot-api:latest
          for _ in $(seq 30); do
            curl -sf "http://127.0.0.1:8081/bot$TELEGRAM_BOT_TOKEN/getMe" >/dev/null &&
              break
            sleep 2
          done
          python3 release_telegram.py
