name: telegram-check

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  post:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Render telegram notes
        run: |
          flutter pub get
          mkdir -p dist
          dart run tool/changelog.dart render telegram --tag v0.1.2 --out telegram.md
          cat telegram.md

      - name: Post to telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TAG: v0.1.2
        run: |
          python3 -m pip install --user --break-system-packages --quiet requests
          python3 release_telegram.py
