name: telegram-check

# Posts the notes for one tag without rebuilding the artifacts, so channel
# access can be checked after a permission change instead of with a new tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to announce, defaults to the newest one
        required: false

env:
  DART_VERSION: '3.13.5'

jobs:
  post:
    runs-on: ubuntu-26.04
    services:
      telegram-bot-api:
        image: aiogram/telegram-bot-api:latest
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        ports:
          - 8081:8081
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}

      - name: Render telegram notes
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          tag="${TAG_INPUT:-$(git describe --tags --abbrev=0)}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          mkdir -p dist
          # The changelog tool needs only package:args, so it runs from a
          # scratch package and never triggers the app's native build hooks.
          mkdir -p /tmp/cl
          cp -r tool /tmp/cl/tool
          cd /tmp/cl
          printf 'name: cl\nenvironment:\n  sdk: ">=3.0.0 <4.0.0"\ndependencies:\n  args: any\n' > pubspec.yaml
          dart pub get
          dart run tool/changelog.dart render telegram --tag "$tag" \
            --root "$GITHUB_WORKSPACE" --out telegram.md
          cat "$GITHUB_WORKSPACE/telegram.md"

      - name: Post to telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 -m pip install --user --break-system-packages --quiet requests
          python3 release_telegram.py
