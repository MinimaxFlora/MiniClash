name: telegram-check

on:
  workflow_dispatch:

env:
  DART_VERSION: '3.13.5'

jobs:
  post:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}

      - name: Render telegram notes
        run: |
          mkdir -p dist
          # The changelog tool needs only package:args, so it runs from a
          # scratch package and never triggers the app's native build hooks.
          mkdir -p /tmp/cl
          cp -r tool /tmp/cl/tool
          cd /tmp/cl
          printf 'name: cl\nenvironment:\n  sdk: ">=3.0.0 <4.0.0"\ndependencies:\n  args: any\n' > pubspec.yaml
          dart pub get
          dart run tool/changelog.dart render telegram --tag v0.1.2 \
            --root "$GITHUB_WORKSPACE" --out telegram.md
          cat "$GITHUB_WORKSPACE/telegram.md"

      - name: Post to telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TAG: v0.1.2
        run: |
          python3 -m pip install --user --break-system-packages --quiet requests
          python3 - <<'PY'
          import json, os, requests
          base = "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"]
          chat = requests.get(base + "/getChat", params={"chat_id": "@MiniClashPro"}, timeout=30).json()
          result = chat.get("result") or {}
          print("resolved:", {k: result.get(k) for k in ("id", "title", "username", "type")})
          print("getChat error:", chat.get("description", ""))
          admins = requests.get(
              base + "/getChatAdministrators", params={"chat_id": "@MiniClashPro"}, timeout=30
          ).json()
          print("admins:", [u["user"].get("username") for u in admins.get("result") or []])
          print("admins error:", admins.get("description", ""))
          PY
          python3 release_telegram.py
